name: Keep backend warm

# Koyeb's free tier scales the instance to zero after 1 hour without traffic, so
# the next request pays a ~20-40s cold start. This pings /health during active
# hours only, so real users rarely hit that.
#
# Deliberately NOT 24/7: the instance still sleeps overnight. Koyeb's free web
# instance has no hour cap and is never charged (pricing FAQ), but they do manage
# free-compute abuse — an always-on pinger looks like exactly that, so we keep the
# pattern organic (active hours, then sleep).
#
# The app already handles a cold start gracefully (backend warm-up on load +
# re-poll when it sleeps again), so a delayed or skipped run here is harmless.

on:
  schedule:
    # Minutes 0 and 30, UTC hours 00-16 → every 30 min during WIB 07:00-23:30.
    # GitHub cron is UTC and may be delayed a few minutes under load; a 30-min
    # interval keeps the gap comfortably under Koyeb's 1-hour sleep threshold.
    - cron: '0,30 0-16 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button for testing

# Never run two pings at once (e.g. a manual run overlapping a scheduled one).
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        # If the Koyeb URL ever changes, update it here.
        run: |
          URL="https://fierce-hookworm-f-4-work-96eac868.koyeb.app/health"
          echo "Pinging $URL"
          # --max-time 90 tolerates a cold start (this request is what wakes it).
          # Retry so a transient 5xx/timeout mid-wake doesn't fail the run; a final
          # failure is non-fatal — the app covers real cold starts for users, and we
          # don't want red-X noise from a server that's simply still booting.
          if curl --fail --silent --show-error --location \
                  --max-time 90 --retry 4 --retry-delay 10 --retry-all-errors \
                  "$URL"; then
            echo "OK — backend awake"
          else
            echo "Ping failed (backend may still be waking) — non-fatal"
          fi
