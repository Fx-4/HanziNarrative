<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;box-sizing:border-box}
  body{width:1600px;height:1000px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#eef2ff,#faf5ff 52%,#f5f3ff);font-family:Inter,system-ui,sans-serif}
  .win{width:1400px;border-radius:18px;overflow:hidden;background:#fff;
    box-shadow:0 50px 110px rgba(79,70,229,.28),0 12px 34px rgba(0,0,0,.12)}
  .bar{height:48px;background:#f3f4f6;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid #e5e7eb}
  .dot{width:13px;height:13px;border-radius:50%}
  .url{flex:1;display:flex;justify-content:center}
  .url span{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:7px 22px;font-size:15px;color:#6b7280}
  iframe{width:1400px;height:868px;border:0;display:block}
</style></head><body>
  <div class="win">
    <div class="bar">
      <div class="dot" style="background:#ff5f57"></div>
      <div class="dot" style="background:#febc2e"></div>
      <div class="dot" style="background:#28c840"></div>
      <div class="url"><span>🔒 hanzi-narrative.vercel.app</span></div>
    </div>
    <iframe src="http://localhost:4399/" scrolling="no"></iframe>
  </div>
</body></html>
