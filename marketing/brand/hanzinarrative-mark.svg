<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HanziNarrative">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&amp;display=swap');
      .hz{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;}
    </style>
  </defs>

  <!-- squircle tile (premium superellipse-ish) -->
  <rect x="2" y="2" width="116" height="116" rx="33" fill="url(#brandGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="33" fill="url(#sheen)"/>

  <!-- hero hanzi 汉 (Hàn) — its 氵 three strokes read as 'progress steps' -->
  <text x="59" y="64" text-anchor="middle" dominant-baseline="central" class="hz" font-size="74" fill="#ffffff">汉</text>

  <!-- AI spark (4-point) — the 'narrative intelligence' accent -->
  <path d="M93 21 L96.4 30.6 L106 34 L96.4 37.4 L93 47 L89.6 37.4 L80 34 L89.6 30.6 Z" fill="#fbbf24"/>
</svg>
